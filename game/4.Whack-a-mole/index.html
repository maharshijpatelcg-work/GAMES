<!DOCTYPE html>
<html>
<head>
    <title>Whack-A-Mole Game</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="container">
    <h1>Whack-A-Mole</h1>

    <div class="scoreboard">
        <div class="score-box">
            <h3>Score</h3>
            <div id="score">0</div>
        </div>

        <div class="score-box">
            <h3>Hits</h3>
            <div id="hits">0</div>
        </div>

        <div class="score-box">
            <h3>Time Left</h3>
            <div id="timeLeft">90</div>
        </div>

        <div class="score-box">
            <h3>Best Score</h3>
            <div id="maxScore">0</div>
        </div>
    </div>

    <div id="message"></div>

    <div class="button-row">
        <button id="startBtn" class="start-btn">Start</button>
        <button id="restartBtn" class="restart-btn">Restart</button>
    </div>

    <div class="game-board">
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
    </div>
</div>

<video id="bg-video" autoplay loop muted src="./winning.mp4"></video>

<script src="index.js"></script>
</body>
</html>
