<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test</title>
    <link rel="stylesheet" href="2.css">
</head>
<body>
    <div class="container">
        <h1>⌨️ Typing Speed Test</h1>

        <div class="stats-bar">
            <div class="stat-box">
                <h3>Time</h3>
                <div id="timer">0</div>
            </div>
            <div class="stat-box">
                <h3>WPM</h3>
                <div id="wpm">0</div>
            </div>
            <div class="stat-box">
                <h3>Accuracy</h3>
                <div id="accuracy">100%</div>
            </div>
            <div class="stat-box">
                <h3>Best WPM</h3>
                <div id="bestWPM">0</div>
            </div>
        </div>

        <!-- ⭐ TIME SELECTION BUTTONS (styled to match your theme) ⭐ -->
        <div class="time-buttons">
            <button class="time-btn" data-time="15">15s</button>
            <button class="time-btn" data-time="30">30s</button>
            <button class="time-btn" data-time="60">60s</button>
        </div>

        <div class="text-display" id="textDisplay">
            Click "Start Test" after choosing a time!
        </div>

        <textarea 
            id="typingArea" 
            placeholder="The test will start when you begin typing..."
            disabled
        ></textarea>

        <button id="startBtn" class="start-btn" disabled>Start Test</button>
        <button id="resetBtn" class="reset-btn">Reset Session</button>
    </div>

    <script src="2.js"></script>
</body>
</html>
